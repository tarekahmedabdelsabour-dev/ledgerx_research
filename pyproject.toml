[project]
name = "ledgerx_research"
authors = [{ name = "LedgerX", email = "hello@ledgerx.local" }]
description = "Operations Research for LedgerX: exact, independently verified decisions for product mix, inventory, distribution, routes, scheduling and purchasing"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = ["numpy", "scipy>=1.9"]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<18.0.0"
erpnext = ">=16.0.0-dev,<18.0.0"
